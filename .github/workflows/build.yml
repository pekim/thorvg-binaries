name: build
on:
  push:

permissions:
  contents: read

env:
  GO_VERSION: 1.25

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: install tools
        run: sudo apt-get install python3 ninja-build meson

      - name: build
        run: ./build.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: assets/*

  linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: install tools
        run: sudo apt-get install python3 ninja-build meson

      - name: build
        run: ./build.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: assets/*

  macos-amd64:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: install tools and libraries
        run: brew install libomp llvm meson

      - name: set path
        run: |
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: build
        run: ./build.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: assets/*

  macos-arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: false

      - name: install tools and libraries
        run: brew install libomp llvm meson

      - name: set path
        run: |
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: build
        run: ./build.sh

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}
          path: assets/*
